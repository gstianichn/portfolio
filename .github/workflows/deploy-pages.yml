name: Deploy Portfolio to GitHub Pages (branch deploy)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Prepare environment file
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Install NPM dependencies & build Vite assets
        run: |
          npm ci
          npm run build

      - name: Export Laravel Blade to Static Site (dist/)
        env:
          APP_URL: https://gstianichn.github.io/portfolio
          PORTFOLIO_STATIC_EXPORT: true
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          FORMSPREE_ENDPOINT: ${{ secrets.FORMSPREE_ENDPOINT }}
        run: php artisan portfolio:export-static

      - name: Push static build (dist/) to branch deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          commit_message: 'chore: deploy portfolio static build to GitHub Pages'
